# Configuracion de Quarto para el curso de Ciberseguridad
# Licensed under CC BY-NC-SA 4.0 - Diego Saavedra 2026

project:
  type: book
  output-dir: _site
  resources:
    - "images/*.png"
    - "images/*.jpg"
    - "images/*.svg"

book:
  title: "Fundamentos de Ciberseguridad"
  subtitle: "Protege tu vida digital — Aprende ciberseguridad desde cero"
  author: "Diego Saavedra"
  date: "2026-05-29"
  description: "Curso profesional de ciberseguridad con NIST CSF 2.0, VPN, ZTNA, MFA, CVSS"
  favicon: images/favicon.png
  cover-image: images/cover.png
  
  # Professional navigation features
  reader-mode: true
  back-to-top-navigation: true
  page-navigation: true
  search: true

  # Sidebar config
  sidebar:
    logo: images/favicon.png
    search: true
    collapse-level: 1
    pinned: true

  # Repository info
  repo-url: https://github.com/statick88/course-of-cybersecurity
  repo-branch: main
  repo-actions:
    - edit
    - issue

  # Cover image
  image: images/cover.svg
  image-alt: "Fundamentos de Ciberseguridad"

  # Professional footer
  page-footer:
    border: true
    left: |
      © 2026 **Diego Saavedra**. Licensed under [CC BY-NC-SA 4.0](https://creativecommons.org/licenses/by-nc-sa/4.0/)
    center: |
      Material educativo para **Abacom Capacitación y Servicios**
    right: |
      Built with [Quarto](https://quarto.org/)

  # ─── PARTE I: CURSO PRINCIPAL (5 Unidades) ───
  chapters:
    - index.qmd
    
    # UNIDAD I: Introducción a la Ciberseguridad
    # Subtemas: 1.1 Tríada CIA | 1.2 Gestión de Riesgo ISO 31000/NIST SP 800-30 | 1.3 Clasificación de Activos | 1.4 NIST CSF 2.0
    - part: "UNIDAD I: Introducción a la Ciberseguridad"
      chapters:
        - content/unidad-01/index.qmd
        - content/unidad-01/minicurso-git-github.qmd
        - content/unidad-01/lab-01-nist-csf.qmd
        - content/unidad-01/quiz-01.qmd
    
    # UNIDAD II: Seguridad en SO y Gestión de Identidad
    # Subtemas: 2.1 Modelo OSI y TCP-IP | 2.2 Firewalls | 2.3 IDS/IPS | 2.4 Arquitectura de Defensa Perimetral
    - part: "UNIDAD II: Seguridad en Sistemas Operativos y Gestión de Identidad"
      chapters:
        - content/unidad-02/teoria-os-hardening.qmd
        - content/unidad-02/teoria-iam.qmd
        - content/unidad-02/minicurso-bash.qmd
        - content/unidad-02/minicurso-ssh.qmd
        - content/unidad-02/minicurso-tmux.qmd
        - content/unidad-02/minicurso-nvim.qmd
        - content/unidad-02/lab-03-iam-matrix.qmd
        - content/unidad-02/quiz-02.qmd
    
    # UNIDAD III: Protocolos e Infraestructura de Red
    # Subtemas: 3.1 Protocolos de Red | 3.2 Arquitectura Zero Trust | 3.3 Segmentación y Microsegmentación | 3.4 VPN y Acceso Remoto
    - part: "UNIDAD III: Protocolos e Infraestructura de Red"
      chapters:
        - content/unidad-03/teoria-protocolos.qmd
        - content/unidad-03/teoria-zerotrust.qmd
        - content/unidad-03/minicurso-nmap.qmd
        - content/unidad-03/minicurso-wireshark.qmd
        - content/unidad-03/minicurso-tcpdump.qmd
        - content/unidad-03/minicurso-netcat.qmd
        - content/unidad-03/minicurso-curl.qmd
        - content/unidad-03/minicurso-openssl.qmd
        - content/unidad-03/lab-04-ztna-setup.qmd
        - content/unidad-03/quiz-03.qmd
    
    # UNIDAD IV: Principios de Seguridad
    # Subtemas: 4.1 Vectores de Ataque y Superficie de Ataque | 4.2 Clasificación de Malware | 4.3 Criptografía Aplicada | 4.4 CVSS y Gestión de Parches
    - part: "UNIDAD IV: Principios de Seguridad — Amenazas, Vulnerabilidades y Criptografía"
      chapters:
        - content/unidad-04/teoria-vulnerabilidades.qmd
        - content/unidad-04/teoria-criptografia.qmd
        - content/unidad-04/teoria-ia-threats.qmd
        - content/unidad-04/minicurso-hashcat.qmd
        - content/unidad-04/minicurso-hydra.qmd
        - content/unidad-04/minicurso-gobuster.qmd
        - content/unidad-04/minicurso-burp-suite.qmd
        - content/unidad-04/minicurso-sqlmap.qmd
        - content/unidad-04/minicurso-metasploit.qmd
        - content/unidad-04/lab-06-vuln-assessment.qmd
        - content/unidad-04/lab-07-pqc-migration.qmd
        - content/unidad-04/lab-08-prompt-injection.qmd
        - content/unidad-04/quiz-04.qmd
    
    # UNIDAD V: Análisis de Datos y Respuesta a Incidentes
    # Subtemas: 5.1 Monitoreo y Logging | 5.2 SOC y SIEM | 5.3 Respuesta a Incidentes y BCP/DRP
    - part: "UNIDAD V: Análisis de Datos y Respuesta a Incidentes"
      chapters:
        - content/unidad-05/teoria-analisis-datos.qmd
        - content/unidad-05/teoria-ir.qmd
        - content/unidad-05/lab-09-ir-tabletop.qmd
        - content/unidad-05/quiz-05.qmd
    
  # ─── PARTE II: APÉNDICES ───
  appendices:
    - part: "Apéndices Contextuales"
      chapters:
        - content/anexo-contexto-latam.qmd
        - content/anexo-etica.qmd
    
    - part: "Laboratorios Avanzados — Explotación Web"
      chapters:
        - labs/lab-anexo-juice-shop.qmd
        - labs/lab-anexo-dvwa.qmd
        - labs/lab-anexo-webgoat.qmd
    
    - part: "Laboratorios Avanzados — IA y Ethical Hacking"
      chapters:
        - labs/lab-anexo-ai-vps.qmd
        - labs/lab-anexo-kali-mcp.qmd
        - labs/lab-anexo-openclaw-security.qmd
        - labs/lab-anexo-llm-security.qmd
        - labs/lab-anexo-ethical-hacking.qmd
        - labs/lab-anexo-herramientas-base.qmd
    
    - part: "Minicursos de Herramientas (Referencia)"
      chapters:
        - minicursos/minicurso-git-github.qmd
        - minicursos/minicurso-docker.qmd
        - minicursos/minicurso-nvim.qmd
        - minicursos/minicurso-tmux.qmd
        - minicursos/minicurso-bash.qmd
        - minicursos/minicurso-curl.qmd
        - minicursos/minicurso-ssh.qmd
        - minicursos/minicurso-openssl.qmd
        - minicursos/minicurso-nmap.qmd
        - minicursos/minicurso-burp-suite.qmd
        - minicursos/minicurso-metasploit.qmd
        - minicursos/minicurso-wireshark.qmd
        - minicursos/minicurso-sqlmap.qmd
        - minicursos/minicurso-hashcat.qmd
        - minicursos/minicurso-hydra.qmd
        - minicursos/minicurso-gobuster.qmd
        - minicursos/minicurso-netcat.qmd
        - minicursos/minicurso-tcpdump.qmd
    
    - part: "Recursos para Instructores"
      chapters:
        - instructor/guia-docente.qmd
        - instructor/manual-estudiante.qmd
        - instructor/rubricas-evaluacion.qmd
        - instructor/acreditacion.qmd

    - part: "Entorno Práctico y Laboratorios"
      chapters:
        - labs/especificacion-laboratorios.qmd
        - labs/manual-despliegue-docker.qmd
        - instructor/guia-docente-laboratorio.qmd

    - part: "Curso Simplificado (Para Principiantes)"
      chapters:
        - content-simplified/index.qmd
        - content-simplified/modulo-01-seguridad-basica.qmd
        - content-simplified/modulo-02-redes.qmd
        - content-simplified/modulo-03-identidades.qmd
        - content-simplified/modulo-04-vulnerabilidades.qmd
        - content-simplified/modulo-05-incidentes.qmd

  # Sharing
  sharing:
    - twitter
    - linkedin

# Format output
format:
  html:
    theme:
      dark: solar
      light: cosmo
    toc: true
    toc-depth: 3
    number-sections: true
    link-external-icon: true
    link-external-newwindow: true
    css:
      - css/styles.css
      
  pdf:
    documentclass: report
    papersize: a4
    margin-left: 2cm
    margin-right: 2cm

# Code execution
execute:
  echo: false
  eval: false
  freeze: auto

# Language
language:
  lang: es

# Exclude files
exclude:
  - "*.qmd~"
  - ".git/*"
  - "*.log"