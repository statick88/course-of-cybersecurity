  <!-- Lock Icon -->
  <rect x="520" y="280" width="160" height="140" rx="10" fill="none" stroke="#fff" stroke-width="6"/>
  <path d="M560 280 V230 A40 40 0 0 1 640 230 V280" fill="none" stroke="#fff" stroke-width="6"/>
  <circle cx="600" cy="350" r="25" fill="#e94560"/>
  <rect x="590" y="320" width="20" height="40" fill="#fff"/>
  
  <!-- Title -->
  <text x="600" y="480" font-family="Arial, sans-serif" font-size="56" font-weight="bold" 
